<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFE3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Your Plan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Your Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap">
<style>
/* One light-pink look on purpose: it stays pink even when the phone is in dark mode.
   Rose for actions and progress, lavender for "ready to go up" moments, soft rounded type. */
:root{
  --bg:#FFF5F8; --top:#FFE3EE; --card:#FFFFFF; --card2:#FFF0F5; --ink:#3B1F2C; --muted:#8C6474; --line:#F5D8E3;
  --accent:#C83A75; --accent-ink:#FFFFFF; --accent-soft:#FDE3EE; --accent-2:#7A4BB0; --accent-2-soft:#F2E8FC;
  --warn:#9C5B0B; --warn-soft:#FFF0DC; --danger:#B83246; --band:rgba(200,58,117,.13);
  --shadow:0 1px 2px rgba(200,58,117,.06), 0 6px 20px rgba(200,58,117,.08);
  --r:22px; --nav-h:64px;
  --font: "Nunito", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);background:linear-gradient(180deg,var(--top) 0,var(--bg) 380px) no-repeat,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--top)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--top) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top-in{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.top-in .hello{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hello h1{margin:0;font-size:22px;letter-spacing:-.01em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:21px;height:21px;stroke:var(--ink)}
.iconbtn.on{background:var(--accent-soft);border-color:transparent}
main{padding-top:4px}
h2{font-size:20px;margin:22px 2px 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.card.warn{background:var(--warn-soft);border-color:transparent;box-shadow:none}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;border:0}
.chip.plain{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 15px;font-size:14px;border-radius:999px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.hero{padding:6px 2px 2px}
.hero .date{color:var(--muted);font-size:14px;font-weight:500}
.hero h2{margin:2px 0 4px;font-size:29px;letter-spacing:-.02em;font-weight:900}
h2,h3,.ex-n,.meal-t{font-weight:800}
.hero .focus{color:var(--muted)}
.strip{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:14px 0;width:100%;text-align:left;box-shadow:var(--shadow)}
.strip .cell{flex:1;min-width:0}
.strip .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.strip .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.strip .sub{font-size:12.5px;color:var(--muted)}
.strip .go{align-self:center;color:var(--muted)}
.bar{position:relative;height:10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:99px}
.bar .band{position:absolute;top:0;bottom:0;background:var(--band);border-left:1.5px solid var(--accent);border-right:1.5px solid var(--accent);opacity:.9}
.guide{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 2px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.ex-h{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 8px}
.ex-num{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;margin-top:1px}
.ex-n{font-weight:700;font-size:16.5px;line-height:1.25}
.ex-p{color:var(--muted);font-size:14px;margin-top:2px}
.ex .cue{margin:0 14px 8px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:14px;color:var(--ink);display:none}
.ex.showcue .cue{display:block}
.cuebtn{margin-left:auto;flex:none;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 4px;min-height:32px}
.last{margin:0 14px 6px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.last>span{flex:1 1 150px}
.samebtn{flex:none;border:1.5px solid var(--line);background:var(--card2);color:var(--accent);font:inherit;font-size:13px;font-weight:800;border-radius:999px;padding:0 13px;min-height:36px}
.samebtn:active{background:var(--accent-soft)}
.ready{margin:2px 14px 8px;padding:9px 12px;border-radius:12px;background:var(--accent-2-soft);color:var(--ink);font-size:13.5px}
.ready b{color:var(--accent-2)}
.sets{padding:2px 10px 12px}
.sethead,.set{display:grid;grid-template-columns:28px minmax(0,1.75fr) minmax(0,1fr) 48px;gap:7px;align-items:center}
.sets.nw .sethead,.sets.nw .set{grid-template-columns:28px minmax(0,1fr) 48px}
.sethead{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:0 4px 4px}
.set{padding:4px}
.set .sn{font-weight:600;color:var(--muted);text-align:center}
.set input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.set input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--band)}
.set input::placeholder{color:var(--muted);opacity:.65;font-weight:500}
.check{width:48px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:var(--muted);opacity:.5}
.set.done .check{background:var(--accent);border-color:var(--accent)}
.set.done .check svg{stroke:var(--accent-ink);opacity:1}
.set.done input{background:var(--accent-soft);border-color:transparent}
.wstep{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;align-items:center;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card2);overflow:hidden}
.wstep button{height:100%;border:0;background:transparent;font-size:21px;font-weight:800;color:var(--accent);padding:0;line-height:1}
.wstep button:active{background:var(--accent-soft)}
.set .wstep input{height:100%;border:0;border-radius:0;background:transparent;padding:0;min-width:0}
.set .wstep input:focus{box-shadow:none}
.wstep:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--band)}
.set.done .wstep{background:var(--accent-soft);border-color:transparent}
.set.done .wstep input{background:transparent}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border-radius:14px;background:var(--card2);border:1px solid transparent;font:inherit;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.wd .dot{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;background:var(--card)}
.wd .dot svg{width:14px;height:14px;stroke:var(--accent-ink);opacity:0}
.wd.wlift .dot{border:2.5px solid var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.wd.done .dot{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent}
.wd.done .dot svg{opacity:1}
.wd.today{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wd.missed{cursor:pointer}
.wd.missed .dot{border-style:dashed;opacity:.8}
.wd{position:relative}
.wd .vb{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent-2)}
.vrow{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.vids .vrow:first-of-type{border-top:0}
.vopen{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.vopen .nm{display:block;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.vopen .mc{display:block;font-size:13px;color:var(--muted)}
.vopen .go{color:var(--accent);font-weight:800}
.vplay{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff}
.vplay svg{width:18px;height:18px;fill:currentColor;margin-left:2px}
.vplay.sm{width:36px;height:36px;border-radius:12px}
.vplay.sm svg{width:15px;height:15px}
.field .row input{flex:1;min-width:0}
.vtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.vtag{font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 9px;border:0}
.vtag.f{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;font-weight:800;padding:7px 12px}
.vtag.f.on{background:var(--accent);color:#fff;border-color:transparent}
.vex{margin:0 0 4px 56px}
.vexr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.vexr .nm{font-weight:700;font-size:15px;line-height:1.25}
.vexr .mc{font-size:12.5px;color:var(--muted)}
.vdots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:130px}
.vdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);background:var(--card);display:grid;place-items:center;padding:0}
.vdot svg{width:13px;height:13px;stroke:#fff;opacity:0}
.vdot.on{background:var(--accent)}.vdot.on svg{opacity:1}
.vall{border:0;background:transparent;color:var(--accent);font:inherit;font-size:13.5px;font-weight:800;padding:6px 0}
.capbox{width:100%;min-height:104px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:10px 12px;font:inherit;font-size:16px;line-height:1.4;resize:vertical;color:var(--ink)}
.cappre{margin:8px 0 2px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:13.5px}
.cappre ol{margin:6px 0 0;padding-left:20px}.cappre li{margin:2px 0}
.labrow{display:flex;justify-content:space-between;align-items:center}
.minipaste{border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:800;padding:2px 0}
details.how{font-size:13px;color:var(--muted);margin:4px 0 0}details.how summary{color:var(--accent);font-weight:700}
.pastebtn{flex:none;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-size:15px;font-weight:800;padding:0 16px}
.wd .lb{font-size:10px;line-height:1.15;text-align:center;min-height:23px;max-width:100%;padding:0 2px;overflow-wrap:anywhere}
.gitem .gp{display:block;font-size:12px;font-weight:700;color:var(--accent);margin-top:1px}
.gitem.on .gp{opacity:.55}
.ex.alldone .ex-num{background:var(--accent);color:var(--accent-ink)}
.complete{margin:18px 0 8px}
.donebox{text-align:center;padding:20px 16px}
.donebox .big{font-size:20px;font-weight:800;margin-bottom:2px}
.donebox .heart svg{width:36px;height:36px;fill:var(--accent);margin-bottom:4px}
.activity .mins{display:flex;gap:10px;align-items:center;margin-top:12px}
.activity input{width:96px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-align:center;font-size:18px;font-weight:600}
ul.clean{margin:6px 0 0;padding-left:18px}
ul.clean li{margin:3px 0}
details.meal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
details.meal summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
details.meal summary::-webkit-details-marker{display:none}
.day{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--card2);padding:6px 0;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day.today{background:var(--accent);color:var(--accent-ink)}
.meal-t{font-weight:700;line-height:1.25}
.meal-m{font-size:13.5px;color:var(--muted);margin-top:2px}
.meal-body{padding:0 16px 16px}
.meal-body h4{margin:12px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meal-body ol{margin:4px 0;padding-left:20px}
.meal-body ol li{margin:5px 0}
.datenav{display:flex;align-items:center;gap:8px;margin:8px 0}
.datenav .d{flex:1;text-align:center;font-weight:700}
.datenav .d small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.totals .big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.totals .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.slot-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.slot-h h3{margin:0}
.entry{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.entry .nm{flex:1;min-width:0;font-weight:550}
.entry .mc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{width:38px;height:38px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.mini svg{width:19px;height:19px;stroke:currentColor}
.mini.fav{color:var(--accent-2)}
.mini.fav svg{fill:currentColor}
.empty{padding:6px 14px 14px;color:var(--muted);font-size:14px}
.opt{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);background:var(--card);border-radius:14px;margin:8px 0}
.opt .nm{font-weight:650}
.opt .mc{font-size:13px;color:var(--muted)}
.opt .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field input,.field select{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .s{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0}
table.t td.r,table.t th.r{text-align:right}
.lift{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lift:first-of-type{border-top:0}
.cons{display:flex;gap:6px;align-items:flex-end;height:86px;margin-top:8px}
.cons .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cons .b{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(0deg,var(--accent-2),var(--accent));min-height:3px}
.cons .b.zero{background:var(--line)}
.cons .l{font-size:10.5px;color:var(--muted)}
.cons .n{font-size:11px;font-weight:700}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.stepper button{width:40px;height:40px;border:0;background:transparent;font-size:20px;font-weight:600}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:8px;flex-wrap:wrap}
.toggle button{min-height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.toggle button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.gcat h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 2px 6px}
.gitem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:6px 0;width:100%;text-align:left}
.gitem .box{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.gitem .box svg{width:16px;height:16px;stroke:var(--accent-ink);opacity:0}
.gitem.on .box{background:var(--accent);border-color:var(--accent)}
.gitem.on .box svg{opacity:1}
.gitem.on .gn{text-decoration:line-through;color:var(--muted)}
.gitem .gn{flex:1;font-weight:600}
.gitem .gq{color:var(--muted);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.gitem .gf{display:block;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs svg{width:24px;height:24px;stroke:currentColor}
nav.tabs button.on{color:var(--accent)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:31;max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#timer.on{display:flex}
body.timing{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px)}
#timer .t{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;min-width:66px}
#timer .lb{font-size:12px;opacity:.7;flex:1;line-height:1.2}
#timer button{min-height:40px;padding:0 11px;border-radius:12px;border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:650;font-size:14px}
#timer.end{background:var(--accent);color:var(--accent-ink)}
#sheetWrap{position:fixed;inset:0;z-index:50;display:none}
#sheetWrap.on{display:block}
#sheetWrap .scrim{position:absolute;inset:0;background:rgba(59,31,44,.36)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
#sheet h3{font-size:19px;margin:4px 0 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 76px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--accent);font-weight:650;padding:8px 0;min-height:44px}
.phase{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:14px 0}
.phase.now{border-color:var(--accent)}
.phase .wk{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.phase.now .wk{color:var(--accent)}
.sched{display:grid;grid-template-columns:52px 1fr;gap:6px 10px;font-size:14.5px}
.sched b{color:var(--muted);font-weight:700}
/* ===================== THEME: planner x studio (v9) =====================
   Material: butter paper with berry ink and one pink neoprene object.
   Type: Instrument Serif for titles and big numbers, Bricolage Grotesque for everything you tap.
   Pink lands in one place per screen: the exercise you're on (or the main action). Rules, not cards. */
:root{
  --bg:#FFF4D6; --top:#FFF4D6; --card:#FFFBEF; --card2:#FFF8E4; --ink:#3D1427; --muted:#7E5965;
  --line:rgba(61,20,39,.14); --rule:#3D1427; --butter:#FFE59A;
  --accent:#BE3A74; --accent-ink:#FFF4D6; --accent-soft:#FAD3E1; --pink:#E05A93;
  --accent-2:#3D1427; --accent-2-soft:#FFE9AE; --band:rgba(224,90,147,.22);
  --shadow:none; --r:24px; --nav-h:64px;
  --font:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
html,body{font-size:16px;line-height:1.45}
body{background:var(--bg);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 34px)}
header.top{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
input[type=checkbox]{accent-color:var(--ink)}
.trend{display:flex;flex-direction:column;gap:6px;padding:4px 0 6px}
.trend-n{font:400 64px/.9 var(--serif);letter-spacing:-.035em}
.trend-n span{font:500 18px var(--font);letter-spacing:0;color:var(--muted)}
.trend-l{font-size:15px;color:var(--ink);max-width:330px}
.eyebrow{font:italic 400 17px/1.2 var(--serif);letter-spacing:0;text-transform:none;color:var(--muted)}
.hello h1{font:400 30px/1.05 var(--serif);letter-spacing:-.01em}
.iconbtn{border:1.5px solid var(--line);background:transparent;border-radius:50%}
h2{font:400 31px/1.05 var(--serif);letter-spacing:-.015em;margin:30px 2px 6px}
h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
h2,h3,.ex-n,.meal-t{font-weight:inherit}
h3,.meal-t{font-weight:700}
.card{background:transparent;border:0;border-top:1.5px solid var(--rule);border-radius:0;box-shadow:none;padding:14px 2px 6px;margin:20px 0 0}
.card.soft,.card.warn{border:0;border-radius:var(--r);padding:16px 18px;margin:16px 0 0}
.card.soft{background:var(--accent-soft)}
.card.warn{background:var(--accent-2-soft)}
.muted{color:var(--muted)}
.chip{background:var(--accent-soft);color:var(--ink);font-weight:600;padding:6px 12px}
.chip.plain{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn{min-height:50px;border:1.5px solid var(--rule);background:transparent;font-weight:700;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:40px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
/* hero: big serif title, the pink dumbbell is the object */
.hero{position:relative;padding:10px 2px 4px}
.hero .date{color:var(--ink);font-size:14px;font-weight:600}
.hero h2{font:400 54px/.92 var(--serif);letter-spacing:-.035em;margin:12px 0 10px;max-width:calc(100% - 92px)}
.hero .focus{font-size:16px;color:var(--muted)}
.hero-db{position:absolute;right:-2px;top:34px;width:92px;height:auto;transform:rotate(-28deg);pointer-events:none}
/* week: capsules from the dumbbell */
.week{gap:6px;margin-top:12px}
.wd{background:transparent;border:0;padding:0;gap:5px;font-size:12px;font-weight:700;color:var(--ink)}
.wd .dot{width:100%;height:44px;border-radius:16px;border:0;background:var(--butter)}
.wd.wlift .dot{border:0;background:var(--accent-soft)}
.wd.done .dot{background:var(--pink)}
.wd .dot svg{width:16px;height:16px;stroke:var(--ink)}
.wd.today{background:transparent;color:var(--ink)}
.wd.today .dot{box-shadow:inset 0 0 0 2.5px var(--ink)}
.wd.missed .dot{background:repeating-linear-gradient(-45deg,var(--accent-soft) 0 6px,var(--bg) 6px 12px);opacity:1}
.wd .lb{font-size:10.5px;font-weight:500;color:var(--muted)}
.wd .vb{top:29px;right:7px;background:var(--ink)}
.lnk{border:0;background:none;padding:0;color:var(--ink);font:inherit;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer}
.hero-meta{display:flex;gap:6px 20px;flex-wrap:wrap;margin-top:14px;font-size:15px}
.guide-t{margin:18px 2px 4px;font-size:14.5px;color:var(--muted);line-height:1.5}
.guide-t .lnk{color:var(--accent)}
/* targets: a ledger line */
.strip{background:transparent;border:0;border-top:1.5px solid var(--rule);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:14px 2px 14px;margin:20px 0 0;gap:18px}
.strip .lbl{font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);order:2}
.strip .cell{display:flex;flex-direction:column}
.strip .val{font:400 36px/1 var(--serif);letter-spacing:-.02em;order:1}
.strip .val .small{font:500 14px var(--font);letter-spacing:0}
.strip .sub{order:3;font-size:12.5px}
.strip .bar{order:4}
.bar{height:10px;background:var(--butter);border:0}
.bar .fill{background:var(--pink)}
.bar .band{background:transparent;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.55}
.guide{gap:8px;margin:18px 0 0}
/* exercises: ruled rows; the current one is the pink neoprene block */
.ex{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;margin:0;overflow:visible}
.ex-h{padding:16px 2px 8px;gap:12px}
.ex-num{width:auto;min-width:26px;height:auto;background:transparent;color:var(--accent);font:400 32px/1 var(--serif);margin-top:-2px;border-radius:0;display:block}
.ex-n{font:400 25px/1.05 var(--serif);letter-spacing:-.01em}
.ex-p{font-size:14px}
.cuebtn{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.ex .cue{background:var(--card);margin:0 2px 10px}
.last{margin:0 2px 8px;color:var(--muted)}
.ready{margin:2px 2px 10px;background:var(--accent-2-soft);border-radius:16px}
.ready b{color:var(--ink)}
.sets{padding:2px 0 14px}
.sethead{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600}
.set input,.wstep{background:var(--card);border:1.5px solid var(--line);border-radius:16px;height:50px}
.set input{font:700 19px var(--font)}
.check{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--rule);background:transparent}
.check svg{stroke:var(--ink);opacity:.25}
.set.done .check{background:var(--ink);border-color:var(--ink)}
.set.done .check svg{stroke:var(--bg);opacity:1}
.set.done input,.set.done .wstep{background:var(--card2);border-color:transparent}
.wstep button{color:var(--ink)}
.ex.alldone .ex-num{background:transparent;color:var(--muted)}
.ex.alldone .ex-n{color:var(--muted)}
.ex.cur{background:var(--pink);border:0;border-radius:30px;margin:14px -6px 10px;padding:4px 14px 6px}
.ex.cur+.ex{border-top:0}
.ex.cur .ex-num{color:var(--bg);font-size:44px}
.ex.cur .ex-p,.ex.cur .last,.ex.cur .sethead,.ex.cur .set .sn{color:var(--ink)}
.ex.cur .cuebtn{color:var(--ink)}
.ex.cur .set input,.ex.cur .wstep{background:#fff;border-color:transparent}
.ex.cur .set input::placeholder{color:#C98AA6;opacity:1}
.ex.cur .check{border:2.5px solid var(--ink)}
.ex.cur .set.done input,.ex.cur .set.done .wstep{background:rgba(255,255,255,.55)}
.ex.cur .ready{background:rgba(255,244,214,.7)}
.ex.cur .samebtn{background:rgba(255,255,255,.6);border-color:transparent;color:var(--ink)}
.ex.cur .cue{background:rgba(255,255,255,.6)}
.samebtn{background:transparent;border:1.5px solid var(--rule);color:var(--ink)}
.complete{margin:20px 0 8px}
.donebox{border-top:0;text-align:center;padding:26px 16px 18px;background:var(--pink);border-radius:30px;margin-top:18px}
.donebox .big{font:400 36px/1 var(--serif);margin-bottom:6px}
.donebox .heart svg{fill:var(--ink)}
.donebox .muted{color:var(--ink)}
.donebox .btn.ghost{border-color:var(--ink)}
/* video workouts */
.vplay{background:var(--ink);color:var(--bg);border-radius:50%}
.vtag{background:var(--accent-soft);color:var(--ink)}
.vtag.f.on{background:var(--ink);color:var(--bg)}
.vdot{border-color:var(--ink);background:transparent}
.vdot.on{background:var(--ink)}
.vdot svg{stroke:var(--bg)}
.vall,.minipaste,details.how summary,.vopen .go,a,.back{color:var(--accent)}
.pastebtn{background:transparent;border:1.5px solid var(--rule);color:var(--ink);border-radius:16px}
.capbox{background:var(--card);border:1.5px solid var(--line);border-radius:16px}
.cappre{background:var(--accent-2-soft);border-radius:16px}
/* lists everywhere become ruled rows */
details.meal,.slot{background:transparent;border:0;border-top:1.5px solid var(--rule);border-radius:0;box-shadow:none;margin:0}
details.meal+details.meal{border-top:1px solid var(--line)}
details.meal summary{padding:16px 2px}
.meal-t{font:400 23px/1.1 var(--serif);letter-spacing:-.01em}
.meal-body{padding:0 2px 18px}
.meal-body h4{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.day{background:transparent;border:1.5px solid var(--line);border-radius:14px;color:var(--ink)}
.day.today{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.slot{margin-top:18px}
.slot-h{padding:14px 2px 6px}
.slot-h h3{font:400 25px/1 var(--serif)}
.entry{padding:11px 2px}
.empty{padding:4px 2px 14px}
.totals .big{font:400 46px/1 var(--serif);letter-spacing:-.02em}
.stat .k,table.t th,.phase .wk,.opt .tag,.gcat h3{text-transform:none;letter-spacing:0}
.stat .k{font-size:13px}
.stat .v{font:400 34px/1.05 var(--serif);letter-spacing:-.02em}
.gcat h3{font:italic 400 21px var(--serif);color:var(--ink);margin:22px 2px 4px}
.gitem{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:13px 2px}
.gitem .box{border-radius:50%;border-color:var(--rule)}
.gitem.on .box{background:var(--ink);border-color:var(--ink)}
.gitem .box svg{stroke:var(--bg)}
.gitem .gp{color:var(--accent)}
.opt{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:14px 2px}
.opt .nm{font-weight:700}
.field span{color:var(--ink);font-weight:600}
.field input,.field select{background:var(--card);border:1.5px solid var(--line);border-radius:16px;height:50px}
.toggle button{border-radius:99px;border:1.5px solid var(--line);background:transparent}
.toggle button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{background:transparent;border:1.5px solid var(--line);border-radius:99px}
.cons .b{background:var(--pink);border-radius:10px 10px 4px 4px}
.cons .b.zero{background:var(--butter)}
.lift{border-top-color:var(--line)}
.mini.fav{color:var(--accent)}
.phase{border-left:2px solid var(--line)}
.phase.now{border-color:var(--pink)}
.activity input{background:var(--card);border:1.5px solid var(--line);border-radius:16px}
/* nav: a berry bar with a pink capsule for where you are */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--ink);border:0;border-radius:26px;padding-bottom:0;-webkit-backdrop-filter:none;backdrop-filter:none;max-width:536px;margin:0 auto}
nav.tabs .in{height:var(--nav-h);padding:0 6px}
nav.tabs button{color:rgba(255,244,214,.62);font-weight:600;position:relative;isolation:isolate}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::before{content:"";position:absolute;inset:8px 3px;border-radius:18px;background:var(--pink);z-index:-1}
#timer{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);background:var(--ink);color:var(--bg);border-radius:24px;box-shadow:none}
#timer .t{font:400 34px/1 var(--serif)}
#timer.end{background:var(--pink);color:var(--ink)}
#toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px);background:var(--ink);color:var(--bg);border-radius:16px}
#sheetWrap .scrim{background:rgba(61,20,39,.4)}
#sheet{background:var(--bg);border-radius:28px 28px 0 0}
#sheet h3{font:400 32px/1.05 var(--serif);letter-spacing:-.015em;margin:6px 0 12px}
#sheet .grab{background:var(--line)}
.chart text{font-family:var(--font)}
#print{display:none}
@media print{
  @page{size:Letter;margin:14mm 14mm 16mm}
  body{background:#fff;color:#111;padding:0;font-size:10.5pt}
  header.top,main,nav.tabs,#timer,#sheetWrap,#toast{display:none!important}
  #print{display:block}
  #print h1{font-size:22pt;margin:0 0 2pt;letter-spacing:-.01em}
  #print h2{font-size:13.5pt;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1.5pt solid #E05A93;color:#3D1427}
  #print h3{font-size:11pt;margin:9pt 0 3pt}
  #print p,#print li{margin:2pt 0}
  #print ul,#print ol{margin:2pt 0 4pt;padding-left:15pt}
  #print .sub{color:#555}
  #print table{width:100%;border-collapse:collapse;margin:4pt 0 6pt;font-size:9.8pt}
  #print td,#print th{border:0.6pt solid #cfcfcf;padding:3pt 5pt;text-align:left;vertical-align:top}
  #print th{background:#FFE9AE}
  #print .two{display:grid;grid-template-columns:1fr 1fr;gap:10pt}
  #print .box{border:0.8pt solid #F4B3C8;border-radius:6pt;padding:7pt 9pt;margin:5pt 0;break-inside:avoid}
  #print .avoid{break-inside:avoid}
  #print h2,#print h3{break-after:avoid;page-break-after:avoid}
  #print .pb{break-before:page}
  #print .note{font-size:9pt;color:#555}
}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">

  <button class="iconbtn" data-act="page" data-page="settings" aria-label="Settings" id="btnSettings"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

<main class="wrap" id="view"></main>
<div id="timer" role="timer" aria-live="polite"><div class="t" id="timerT">1:30</div><div class="lb" id="timerL">Rest<br>between sets</div><button data-act="timer-add" data-s="-15">−15</button><button data-act="timer-add" data-s="15">+15</button><button data-act="timer-stop">Done</button></div>

  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Today</button>
  <button data-act="tab" data-tab="meals"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 8c0-1.5 1-2 1-3.5M12 8c0-1.5 1-2 1-3.5M16 8c0-1.5 1-2 1-3.5"/></svg>Meals</button>
  <button data-act="tab" data-tab="nutrition"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>Nutrition</button>
  <button data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progress</button>
  <button data-act="tab" data-tab="grocery"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Grocery</button>
</div></nav>
<div id="sheetWrap"><div class="scrim" data-act="sheet-close"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* ===================== PLAN DATA (from the plan, verbatim numbers) ===================== */
const PLAN = {

function migrate(s){

}

/* ===================== SHARED SYNC =====================
   Inside a Claude artifact, the plan is stored in the artifact's shared database as
   one "core" document (settings, weigh-ins, waist, favorites, swaps, grocery) plus one
   document per month of workouts, activity and food logs. This browser keeps a copy,
   so the app still opens instantly and works offline. Opened as a plain file, it stays
   on this device only. Newest edit wins per document. */
const SY = {db:null, status:"local", known:{}, last:{}, pend:new Set(), fly:new Set(), ready:false, timer:null, tries:{}};
const META = KEY + ".sync";
let metaT = {}; try { metaT = JSON.parse(localStorage.getItem(META) || "{}") || {}; } catch(e){ metaT = {}; }
function saveMeta(){ try { localStorage.setItem(META, JSON.stringify(metaT)); } catch(e){} }
function stable(v){
  if (Array.isArray(v)) return "[" + v.map(x=>stable(x===undefined?null:x)).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",") + "}";
  return JSON.stringify(v === undefined ? null : v);
}
const MONTH_KINDS = ["workouts","moves","meals"];
const CORE_KEYS = ["v","created","settings","favorites","weighins","waist","swaps","grocery"];
function docsOf(st){
  const out = {core:{}};
  CORE_KEYS.forEach(k=>{ if (st[k]!==undefined) out.core[k] = st[k]; });
  MONTH_KINDS.forEach(k=>Object.keys(st[k]||{}).forEach(d=>{
    const id = "m-" + d.slice(0,7);
    const doc = out[id] || (out[id] = {workouts:{},moves:{},meals:{}});
    doc[k][d] = st[k][d];
  }));
  return out;
}
const emptyDoc = id => id === "core" ? null : {workouts:{},moves:{},meals:{}};
function applyDoc(id, body){
  if (id === "core"){ CORE_KEYS.forEach(k=>{ if (body[k]!==undefined) S[k] = body[k]; }); S = migrate(S); return; }
  const pre = id.slice(2);
  MONTH_KINDS.forEach(k=>{
    S[k] = S[k] || {};
    Object.keys(S[k]).forEach(d=>{ if (d.slice(0,7) === pre) delete S[k][d]; });
    Object.assign(S[k], (body && body[k]) || {});
  });
}
/* First time this device meets the shared plan: keep entries from both sides */
function mergeFirst(id, L, R){
  if (!L) return R;
  if (id === "core"){
    const unionBy = (a,b,key)=>{ const m = new Map(); (a||[]).forEach(x=>m.set(key(x),x)); (b||[]).forEach(x=>m.set(key(x),x)); return [...m.values()]; };
    return {...R,
      weighins: unionBy(R.weighins, L.weighins, x=>x.date),
      waist: unionBy(R.waist, L.waist, x=>x.date),
      favorites: unionBy(R.favorites, L.favorites, f=>`${f.name}|${f.kcal}|${f.protein}`)};
  }
  const out = {workouts:{...(R.workouts||{})}, moves:{...(R.moves||{})}, meals:{...(R.meals||{})}};
  MONTH_KINDS.forEach(k=>Object.keys(L[k]||{}).forEach(d=>{ if (!(d in out[k])) out[k][d] = L[k][d]; }));
  return out;
}
function trackLocal(){
  const docs = docsOf(S), now = Date.now();
  let bumped = false;
  new Set([...Object.keys(docs), ...Object.keys(SY.last)]).forEach(id=>{
    const body = docs[id] || emptyDoc(id); if (!body) return;
    const j = stable(body);
    if (j !== SY.last[id]){ SY.last[id] = j; metaT[id] = now; bumped = true; if (SY.ready) queuePush(id); }
  });
  if (bumped) saveMeta();
}
Object.entries(docsOf(S)).forEach(([id,b])=>{ SY.last[id] = stable(b); });

function queuePush(id){ if (!SY.db) return; SY.pend.add(id); clearTimeout(SY.timer); SY.timer = setTimeout(flush, 600); }
function flush(){
  if (!SY.db) return;
  [...SY.pend].forEach(id=>{
    if (SY.fly.has(id)) return;
    SY.pend.delete(id);
    const body = docsOf(S)[id] || emptyDoc(id); if (!body) return;
    const j = stable(body);
    if (j === SY.known[id]) return;
    SY.fly.add(id); setStatus("saving");
    SY.db.collection("plan").doc(id).set({...JSON.parse(JSON.stringify(body)), _t: metaT[id] || Date.now()})
      .then(()=>{ SY.known[id] = j; delete SY.tries[id]; })
      .catch(err=>{
        const c = err && err.code;
        if (c === "invalid_argument"){ SY.db = null; SY.pend.clear(); setStatus("readonly"); return; }
        if (c === "quota_exceeded"){ toast("Shared storage is full. Changes are kept on this device."); return; }
        if (c === "revoked" || c === "not_granted" || c === "capability_disabled" || c === "capability_removed"){ SY.db = null; setStatus("local"); return; }
        SY.tries[id] = (SY.tries[id]||0) + 1; SY.pend.add(id);
        if (SY.tries[id] > 4) setStatus("offline");
      })
      .finally(()=>{
        SY.fly.delete(id);
        if (SY.pend.size && SY.db && SY.status !== "offline"){ clearTimeout(SY.timer); SY.timer = setTimeout(flush, 900 + Math.random()*800); }
        else if (!SY.fly.size && SY.db && SY.status === "saving") setStatus("synced");

  });
}
function onSnap(snap){
  const fromCache = !!(snap.metadata && snap.metadata.fromCache);
  const seen = !!metaT.__seen;
  if (fromCache && !seen) return;
  const full = !SY.ready && !fromCache;
  const list = full ? snap.docs.map(d=>({doc:d})) : snap.docChanges().filter(c=>c.type !== "removed");
  const docs = docsOf(S);
  let changed = false;
  list.forEach(({doc})=>{
    const id = doc.id;
    if (id !== "core" && !/^m-\d{4}-\d{2}$/.test(id)) return;
    const raw = doc.data() || {}, rt = +raw._t || 0;
    const R = {...raw}; delete R._t;
    const rj = stable(R), L = docs[id], lj = L ? stable(L) : null;
    if (rj === lj){ SY.known[id] = rj; if ((metaT[id]||0) < rt) metaT[id] = rt; return; }
    let next;
    if (full && !seen) next = mergeFirst(id, L, R);
    else if (rt >= (metaT[id]||0)) next = R;
    else { SY.known[id] = rj; queuePush(id); return; }
    applyDoc(id, next); changed = true;
    const nj = stable(next);
    SY.last[id] = nj; SY.known[id] = rj;
    if (nj === rj) metaT[id] = rt; else { metaT[id] = Date.now(); queuePush(id); }
  });
  if (full){
    const remote = new Set(snap.docs.map(d=>d.id));
    Object.keys(docsOf(S)).forEach(id=>{ if (!remote.has(id)) queuePush(id); });
    SY.ready = true; metaT.__seen = true;
    setStatus(SY.pend.size ? "saving" : "synced");
  }
  saveMeta();
  if (changed){ saveLocalOnly(); remoteRender(); }
}
async function initSync(){
  const C = window.claude;
  if (!C || typeof C.use !== "function") return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use("db"), C.use("user")]); } catch(e){}
  if (!db){ setStatus("local"); return; }
  let can = null;
  try { can = user && typeof user.can === "function" ? await user.can("data.write") : null; } catch(e){}
  if (can === false){ setStatus("readonly"); return; }
  SY.db = db; setStatus("connecting");
  const t = setTimeout(()=>{ if (!SY.ready) setStatus("offline"); }, 10000);
  db.collection("plan").onSnapshot(snap=>{ onSnap(snap); if (SY.ready){ clearTimeout(t); if (SY.status === "offline" && !SY.pend.size) setStatus("synced"); } },
    err=>{ const c = err && err.code; if (c === "revoked"){ SY.db = null; setStatus("local"); } else setStatus("offline"); });
}

function ensureLog(date){

function blankSets(n){ return Array.from({length:n},()=>({w:"",r:"",d:false})); }
function viewSets(log, ex, wk){
  const n = setsFor(ex, wk);

/* previous sessions for a movement (history key = exercise id) */
function historyFor(id, beforeDate){
  return Object.keys(S.workouts).filter(d=>d<beforeDate).sort().reverse()
    .map(d=>({date:d, sets:(S.workouts[d].sets||{})[id]}))
    .filter(h=>h.sets && h.sets.some(s=>s.d));
}
function lastSummary(id, kind, beforeDate){
  const h = historyFor(id, beforeDate)[0]; if (!h) return null;
  const done = h.sets.filter(s=>s.d);
  let txt;
  if (kind==="lift"){
    const ws = done.map(s=>s.w).filter(w=>w!=="");
    const sameW = ws.length && ws.every(w=>w===ws[0]);
    txt = sameW ? `${ws[0]} lb × ${done.map(s=>s.r||"–").join(", ")}` : done.map(s=>`${s.w||"–"}×${s.r||"–"}`).join(", ");
  } else if (kind==="hold") txt = done.map(s=>`${s.r||"–"}s`).join(", ");
  else if (kind==="cardio") txt = `${done[0].r||"–"} min`;
  else txt = done.map(s=>s.r||"–").join(", ") + " reps";
  return {date:h.date, txt, w: kind==="lift" ? (done.find(s=>s.w!=="")||{}).w : ""};
}
function sessionHitAll(sets, target){
  return sets.length>0 && sets.every(s=>s.d && (num(s.r)??0) >= target);
}
function maxW(sets){ return Math.max(...sets.map(s=>num(s.w)??0)); }
/* overload rule: every prescribed rep, good form, two consecutive sessions -> increase */
function readyToIncrease(id, ex, date){
  const hist = historyFor(id, date).slice(0,2);
  if (hist.length<2) return false;
  const t = topReps(ex);
  if (!hist.every(h=>sessionHitAll(h.sets, t))) return false;
  if (EX[id].kind==="lift") return maxW(hist[0].sets) > 0 && maxW(hist[0].sets) <= maxW(hist[1].sets);
  return true;
}
/* the exact weight to try when the overload rule says go up: last top weight + one step */
function suggestW(ex, date){
  if (EX[ex.id].kind!=="lift" || !readyToIncrease(ex.id, ex, date)) return null;
  const w = maxW(historyFor(ex.id, date)[0].sets);
  return w>0 ? r1(w + (+S.settings.wStep || 2.5)) : null;
}
function bestLiftSeries(id){
  return Object.keys(S.workouts).sort().map(d=>{
    const sets = (S.workouts[d].sets||{})[id]; if (!sets) return null;
    const ws = sets.filter(s=>s.d).map(s=>num(s.w)).filter(w=>w!=null&&w>0);

function weightChart(){
  const E = S.weighins.slice().sort((a,b)=>a.date<b.date?-1:1);
  const W=340,H=220,L=34,R=10,T=12,B=28;
  if (!E.length) return `<div class="muted small" style="padding:18px 0;text-align:center">Your trend chart appears after your first weigh-in.</div>`;
  const weeks = weekly(E,"lb");
  const d0 = E[0].date; let d1 = E[E.length-1].date;
  if (daysBetween(d0,d1)<14) d1 = addDays(d0,14);
  const span = daysBetween(d0,d1);
  const vals = E.map(e=>e.lb);
  const dmin = Math.min(...vals), dmax = Math.max(...vals);
  const zoom = dmin - PLAN.goalMax > 8;   /* far from goal: zoom to the data so the trend is readable */
  const lo = zoom ? Math.floor(dmin-3) : Math.floor(Math.min(PLAN.goalMin, dmin)-2);
  const hi = Math.ceil(Math.max(dmax, PLAN.start - dmax <= 6 ? PLAN.start : dmax) + 2);
  const step = hi-lo > 16 ? 5 : 2;
  const x = d => L + (daysBetween(d0,d)/span)*(W-L-R);
  const y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">`;
  for (let v=Math.ceil(lo/step)*step; v<=hi; v+=step) s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  if (!zoom){
    s += `<rect x="${L}" width="${W-L-R}" y="${y(PLAN.goalMax)}" height="${y(PLAN.goalMin)-y(PLAN.goalMax)}" fill="var(--band)"/>`;
    s += `<text x="${W-R-4}" y="${y(PLAN.goalMax)+11}" text-anchor="end" style="fill:var(--accent);font-weight:600">Goal 140–145</text>`;
  } else {
    s += `<rect x="${L}" width="${W-L-R}" y="${H-B-6}" height="6" fill="var(--band)"/><text x="${W-R-4}" y="${H-B-10}" text-anchor="end" style="fill:var(--accent);font-weight:600">Goal 140–145 is below ↓</text>`;
  }
  if (PLAN.start<=hi) s += `<line x1="${L}" x2="${W-R}" y1="${y(PLAN.start)}" y2="${y(PLAN.start)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/><text x="${L+4}" y="${y(PLAN.start)-4}">Start 165</text>`;
  E.forEach(e=>{ s += `<circle cx="${x(e.date)}" cy="${y(e.lb)}" r="3" fill="var(--accent-2)" opacity=".6"/>`; });
  const pts = weeks.map(w=>{ let d = addDays(w.week,3); if (d<d0) d=d0; if (d>d1) d=d1; return [x(d),y(w.avg)]; });
  if (pts.length>1) s += `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p=>{ s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5"/>`; });
  const mid = addDays(d0, Math.round(span/2));
  [[d0,"start"],[mid,"middle"],[d1,"end"]].forEach(([d,a])=>{ s += `<text x="${x(d)}" y="${H-8}" text-anchor="${a}">${fmtShort(d)}</text>`; });
  return s + `</svg><div class="legend"><span><i style="background:var(--accent-2);opacity:.7"></i>Daily weigh-ins</span><span><i style="background:var(--accent)"></i>Weekly average</span><span><i style="background:var(--band);border-radius:2px"></i>Goal range</span></div>`;
}
function spark(points, w=120, h=36){
  if (points.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const vs = points.map(p=>p.w), lo=Math.min(...vs), hi=Math.max(...vs), rg = hi-lo||1;
  const xy = points.map((p,i)=>[4+i/(points.length-1)*(w-8), h-5-(p.w-lo)/rg*(h-10)]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${xy.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xy[xy.length-1][0]}" cy="${xy[xy.length-1][1]}" r="3" fill="var(--accent)"/></svg>`;
}

/* ===================== GROCERY ===================== */
const COUNT_UNITS = {leaf:"leaves",slice:"slices",scoop:"scoops",piece:"pieces",serving:"servings"};
function frac(q){
  const w = Math.floor(q+1e-9), r = q-w;
  const F = [[0,""],[0.25,"1/4"],[1/3,"1/3"],[0.5,"1/2"],[2/3,"2/3"],[0.75,"3/4"],[1,""]];
  let best = F[0]; F.forEach(f=>{ if (Math.abs(f[0]-r) < Math.abs(best[0]-r)) best=f; });
  const W = best[0]===1 ? w+1 : w;
  return (W? String(W):"") + (best[1] ? (W?" ":"")+best[1] : "") || "0";
}
function fmtQty(q,u){
  if (!q) return "as needed";
  if (u==="oz"||u==="oz cooked"){ const tail = u==="oz cooked"?" cooked":""; return q>=16 ? `${r1(q/16)} lb${tail} (${comma(q)} oz)` : `${r1(q)} oz${tail}`; }
  if (u==="tsp"){ return q>=3 ? fmtQty(q/3,"tbsp") : `${frac(q)} tsp`; }
  if (u==="tbsp" || u==="tbsp grated"){ const g = u==="tbsp grated"?" grated":""; return q>=8 ? `${frac(q/16)} cup${g}` : `${frac(q)} tbsp${g}`; }
  if (u.startsWith("cup")){ const rest = u.slice(3); return `${frac(q)} cup${q>1.01&&!rest?"s":""}${rest}`; }

      const allDone = SESSIONS[sessionFor(date)].ex.every(x=>viewSets(S.workouts[date], x, wk).every(z=>z.d));

async function saveFile(filename, text, type){
  const C = window.claude;
  if (!C || typeof C.use !== "function"){
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  }
  let dl = null;
  try { dl = await C.use("downloads"); } catch(e){}
  if (dl){
    try { await dl.save({filename, data:text}); return true; }
    catch(e){
      if (e && e.code === "invalid_argument"){ try { await dl.save({filename, data:new Blob([text],{type})}); return true; } catch(e2){} }
      else { toast("File not saved"); return false; }
    }
  }
  try { await navigator.clipboard.writeText(text); toast("Saving files isn't available here, so it was copied to your clipboard"); }
  catch(e){ toast("Saving files isn't available in this view"); }
  return false;
}

function importData(file){

      if (!d || typeof d!=="object" || !d.settings || typeof d.workouts!=="object") throw new Error("Not a backup file");
      pendingImport = d;
      const when = j.exported ? ` from ${fmtShort(String(j.exported).slice(0,10))}` : "";
      openSheet(`<h3>Restore this backup${when}?</h3>
        <p class="small" style="margin:0">It replaces everything here${SY.db?" and in the shared plan":""} with ${Object.keys(d.workouts||{}).length} workout days, ${Object.keys(d.meals||{}).length} food-log days and ${(d.weighins||[]).length} weigh-ins.</p>
        <div class="grid2" style="margin-top:16px"><button class="btn" data-act="sheet-close">Cancel</button><button class="btn primary" data-act="import-yes">Replace my data</button></div>`);
    } catch(err){ toast("That file doesn't look like a backup"); }
    $("#importFile").value = "";

function makeIcon(size){
  try {
    const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d");
    g.fillStyle = "#C83A75"; g.fillRect(0,0,size,size);
    const s = size/64; g.strokeStyle = "#ffffff"; g.lineWidth = 5.5*s; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.moveTo(17*s,41*s); g.lineTo(27*s,29*s); g.lineTo(35*s,36*s); g.lineTo(47*s,22*s); g.stroke();
    g.fillStyle = "#FDE3EE"; g.beginPath(); g.arc(47*s,22*s,4.5*s,0,Math.PI*2); g.fill();
    return c.toDataURL("image/png");
  } catch(e){ return ""; }
}
function headTag(tag, attrs){
  const sel = tag + Object.entries(attrs).filter(([k])=>k!=="href"&&k!=="content").map(([k,v])=>`[${k}="${v}"]`).join("");
  let el = document.head.querySelector(sel);
  if (!el){ el = document.createElement(tag); document.head.appendChild(el); }
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}
function setupPWA(){
  headTag("meta",{name:"theme-color",content:"#FFF5F8"});
  headTag("meta",{name:"apple-mobile-web-app-capable",content:"yes"});
  headTag("meta",{name:"apple-mobile-web-app-title",content:"Your Plan"});
  const i180 = makeIcon(180), i192 = makeIcon(192), i512 = makeIcon(512);
  if (i180) headTag("link",{rel:"apple-touch-icon",href:i180});
  try {
    const start = location.href.split("#")[0];
    const man = {name:"Your Plan",short_name:"Your Plan",description:"Training, meals and progress",start_url:start,scope:start.replace(/[^/]*$/,""),display:"standalone",orientation:"portrait",background_color:"#FFF5F8",theme_color:"#FFF5F8",
      icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    headTag("link",{rel:"manifest",href:URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}))});
  } catch(e){}
}
